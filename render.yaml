services:
  - type: web
    name: kanvas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MIGRATIONS_PATH
        value: /app/db/migrations
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: https://kanvas-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kanvas-db
          property: connectionString

  - type: web
    name: kanvas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://kanvas-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kanvas-db
    plan: free
    region: oregon
