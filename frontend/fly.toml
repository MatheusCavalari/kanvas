app = "kanvas-frontend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_API_URL = "https://kanvas-backend.fly.dev"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/"
